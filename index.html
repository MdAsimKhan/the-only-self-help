    <!-- FontAwesome for beautiful icons -->

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow: hidden;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .mindmap-container {
            cursor: grab;
        }
        .mindmap-container:active {
            cursor: grabbing;
        }
        .node-connection {
            transition: stroke 0.3s, stroke-width 0.3s;
            pointer-events: none;
        }
        .node-active {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
            border-color: #6366f1 !important;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Dynamic Nodes transform origins relative to coordinate matrix */
        #mindmap-nodes, #mindmap-svg {
            transform-origin: 0 0;
            transition: transform 0.1s cubic-bezier(0.1, 0.8, 0.2, 1);
        }
        /* Make node cards hover-friendly and grab-draggable */
        .dynamic-node {
            cursor: grab;
        }
        .dynamic-node:active {
            cursor: grabbing;
        }
    </style>
</head>

            </div>
        </div>
    </main>

                        { id: "ch54", num: "54", title: "The Deep Wealth of Shared Presence", author: "Tony Robbins", quote: "The quality of your life is the quality of your relationships.", desc: "Recognize authentic connection as a primary source of well-being and invest consistent time into your core relationships." },
                        { id: "ch55", num: "55", title: "The Sweet Relief of Final Surrender", author: "Epictetus", quote: "Make the best use of what is in your power, and take the rest as it happens.", desc: "Stop wasting finite energy fighting reality and learn to peacefully release what is beyond your control." }
                    ]
                },
                {
                    id: "sec10",
                    title: "PLAY THE INFINITE GAME",
                    color: "#84cc16", 
                    chapters: [
                        { id: "ch56", num: "56", title: "The Quiet Magic of Compound Adjustments", author: "John Wooden", quote: "When you improve a little each day, eventually big things occur.", desc: "Embrace minor, incremental adjustments to compound profound, life-altering growth over time." },
                        { id: "ch57", num: "57", title: "Fluid Evolution Over Rigid Resistance", author: "Charles Darwin", quote: "It is not the strongest of the species that survives, nor the most intelligent, but the one most responsive to change.", desc: "Adapt your daily behaviors and routines quickly when external circumstances or life environments shift." },
                        { id: "ch58", num: "58", title: "The Phoenix Principle: Learning to Burn and Rise", author: "Alan Watts", quote: "The only way to make sense out of change is to plunge into it, move with it, and join the dance.", desc: "Intentionally dismantle and rebuild parts of your identity when old patterns and lifestyles stop serving your growth." },
                        { id: "ch59", num: "59", title: "The Courage to Be Wrong and Update Your Map", author: "John Keynes", quote: "When the facts change, I change my mind. What do you do, sir?", desc: "Remain open-minded and fully willing to revise your beliefs when presented with clearer facts and deeper truths." },
                        { id: "ch60", num: "60", title: "The Empirical Approach to Living", author: "Ralph Waldo Emerson", quote: "All life is an experiment. The more experiments you make the better.", desc: "Constantly test new personal strategies and build feedback loops to objectively find what works for you." },
                        { id: "ch61", num: "61", title: "Growth as an Endless Horizon, Not a Destination", author: "Rainer Maria Rilke", quote: "The only journey is the one within.", desc: "View personal growth as a lifelong, permanent evolution rather than a temporary checklist with an end date." }
                    ]
                }
            ]
        };

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let isDraggingCard = false;
        let draggedNodeId = null;
        let cardStartX = 0;
        let cardStartY = 0;
        let startClientX = 0;
        let startClientY = 0;
        let hasMovedDrag = false;
        let activeNodeId = null;
        let collapsedSections = new Set();
        
        let initialDistance = 0;
        let initialScale = 1;
        let initialPanX = 0;
        let initialPanY = 0;

        let flatChapters = [];
        let currentFlatIndex = -1;

        const workspace = document.getElementById('mindmap-workspace');
        const nodesContainer = document.getElementById('mindmap-nodes');
        const svgCanvas = document.getElementById('mindmap-svg');
        const detailPanel = document.getElementById('detail-panel');
        const navigationList = document.getElementById('navigation-list');

        window.addEventListener('DOMContentLoaded', () => {
            rebuildFlatChapters();
            renderSidebarNavigation();
            initPositions();
            renderMindmapNodes();
            setupEventListeners();
            
            centerWorkspace();
            drawConnections();
            
            setTimeout(() => {
                centerWorkspace();
                drawConnections();
            }, 100);
        });

        window.addEventListener('resize', () => {
            centerWorkspace();
            drawConnections();
        });

        function rebuildFlatChapters() {
            flatChapters = [];
            mindmapData.sections.forEach(sec => {
                sec.chapters.forEach(ch => {
                    flatChapters.push({ ch, sec });
                });
            });
        }

        function initPositions() {
            const coreNode = document.getElementById('core-node');
            coreNode.style.left = '2000px';
            coreNode.style.top = '2000px';
            coreNode.style.transform = 'translate(-50%, -50%)';

            const centerOffset = 2000;
            const ringRadiusSec = 350; 
            const ringRadiusCh = 700;  

            mindmapData.sections.forEach((sec, idx) => {
                const angle = (idx * 2 * Math.PI) / mindmapData.sections.length;
                sec.x = centerOffset + ringRadiusSec * Math.cos(angle);
                sec.y = centerOffset + ringRadiusSec * Math.sin(angle);

                const numChapters = sec.chapters.length;
                const arcSpread = Math.PI / 4.5; 
                const baseAngle = angle; 

                sec.chapters.forEach((ch, chIdx) => {
                    let relativeArc;
                    if (numChapters === 1) {
                        relativeArc = 0;
                    } else {
                        relativeArc = -arcSpread/2 + (chIdx * arcSpread) / (numChapters - 1);
                    }
                    const chAngle = baseAngle + relativeArc;
                    ch.x = centerOffset + ringRadiusCh * Math.cos(chAngle);
                    ch.y = centerOffset + ringRadiusCh * Math.sin(chAngle);
                });
            });
        }

        function findNodeData(nodeId) {
            const sec = mindmapData.sections.find(s => s.id === nodeId);
            if (sec) return sec;
            for (let i = 0; i < mindmapData.sections.length; i++) {
                const ch = mindmapData.sections[i].chapters.find(c => c.id === nodeId);
                if (ch) return ch;
            }
            return null;
        }

        function renderSidebarNavigation() {
            navigationList.innerHTML = '';
            mindmapData.sections.forEach(sec => {
                const isCollapsed = collapsedSections.has(sec.id);
                const sectionEl = document.createElement('div');
                sectionEl.className = 'rounded-lg bg-slate-900/60 overflow-hidden border border-slate-800 transition-all mb-3';
                sectionEl.innerHTML = `
                    <button class="w-full px-3 py-2.5 flex items-center justify-between text-left hover:bg-slate-800/40 transition-colors" onclick="toggleSectionCollapse('${sec.id}')">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${sec.color}"></span>
                            <span class="text-xs font-bold text-slate-200 tracking-wide">${sec.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 transition-transform duration-200 ${isCollapsed ? 'rotate-180' : ''}"></i>
                    </button>
                    <div id="side-list-${sec.id}" class="divide-y divide-slate-800/60 overflow-hidden ${isCollapsed ? 'hidden' : ''}">
                        ${sec.chapters.map(ch => `
                            <button id="side-ch-${ch.id}" class="w-full text-left px-4 py-2 hover:bg-indigo-950/20 text-slate-400 hover:text-white transition-all flex items-start gap-2.5" onclick="focusOnChapterNode('${ch.id}')">
                                <span class="font-mono text-[10px] text-indigo-400 font-semibold mt-0.5 shrink-0">CH ${ch.num}</span>
                                <span class="text-xs leading-relaxed truncate">${ch.title}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
                navigationList.appendChild(sectionEl);
            });
        }

        function toggleSectionCollapse(secId) {
            if (collapsedSections.has(secId)) {
                collapsedSections.delete(secId);
            } else {
                collapsedSections.add(secId);
            }
            renderSidebarNavigation();
            renderMindmapNodes();
            drawConnections();
        }

        function onNodeMouseDown(e, targetObj) {
            if (e.button !== undefined && e.button !== 0) return; 
            e.stopPropagation();
            
            isDraggingCard = true;
            isDragging = false;
            hasMovedDrag = false;
            draggedNodeId = targetObj.id;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            startClientX = clientX;
            startClientY = clientY;
            
            cardStartX = targetObj.x;
            cardStartY = targetObj.y;
        }

        function renderMindmapNodes() {
            document.querySelectorAll('.dynamic-node').forEach(n => n.remove());

            mindmapData.sections.forEach(sec => {
                const isSecCollapsed = collapsedSections.has(sec.id);

                const secNode = document.createElement('div');
                secNode.id = `node-${sec.id}`;
                secNode.className = 'dynamic-node absolute rounded-lg glass-panel px-4 py-2 border text-center transition-shadow duration-300 z-10 select-none';
                secNode.style.borderColor = sec.color;
                secNode.style.boxShadow = `0 4px 20px -2px ${sec.color}25`;
                secNode.style.left = `${sec.x}px`;
                secNode.style.top = `${sec.y}px`;
                secNode.style.transform = 'translate(-50%, -50%)';
                secNode.innerHTML = `
                    <span class="text-[9px] font-bold tracking-widest text-slate-400 block uppercase mb-0.5">Section</span>
                    <h3 class="text-xs font-black text-white uppercase whitespace-nowrap">${sec.title}</h3>
                `;

                secNode.addEventListener('mousedown', (e) => onNodeMouseDown(e, sec));
                secNode.addEventListener('touchstart', (e) => onNodeMouseDown(e, sec));
                secNode.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!hasMovedDrag) {
                        focusOnSection(sec);
                    }
                });

                nodesContainer.appendChild(secNode);

                if (!isSecCollapsed) {
                    sec.chapters.forEach(ch => {
                        const chNode = document.createElement('div');
                        chNode.id = `node-${ch.id}`;
                        chNode.className = `dynamic-node absolute rounded-lg bg-slate-900 border border-slate-800 p-3 hover:border-slate-500 transition-all duration-200 z-10 cursor-pointer w-52 select-none ${activeNodeId === ch.id ? 'node-active' : ''}`;
                        chNode.style.left = `${ch.x}px`;
                        chNode.style.top = `${ch.y}px`;
                        chNode.style.transform = 'translate(-50%, -50%)';
                        chNode.innerHTML = `
                            <div class="flex items-center gap-1.5 mb-1 text-[9px] font-bold text-indigo-400 tracking-wider">
                                <span class="bg-indigo-950/40 px-1 py-0.5 rounded border border-indigo-900/30">CH ${ch.num}</span>
                            </div>
                            <h4 class="text-xs font-bold text-slate-200 leading-normal line-clamp-2">${ch.title}</h4>
                        `;

                        chNode.addEventListener('mousedown', (e) => onNodeMouseDown(e, ch));
                        chNode.addEventListener('touchstart', (e) => onNodeMouseDown(e, ch));
                        chNode.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (!hasMovedDrag) {
                                selectChapter(ch, sec);
                            }
                        });

                        nodesContainer.appendChild(chNode);
                    });
                }
            });
        }

        function drawConnections() {
            svgCanvas.innerHTML = '';
            const coreCenter = { x: 2000, y: 2000 };

            mindmapData.sections.forEach(sec => {
                const secX = sec.x;
                const secY = sec.y;

                const pathSec = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const dSec = `M ${coreCenter.x} ${coreCenter.y} Q ${(coreCenter.x + secX) / 2} ${(coreCenter.y + secY) / 2} ${secX} ${secY}`;
                pathSec.setAttribute("d", dSec);
                pathSec.setAttribute("fill", "none");
                pathSec.setAttribute("stroke", "rgba(255, 255, 255, 0.12)");
                pathSec.setAttribute("stroke-width", "2.5");
                pathSec.setAttribute("class", "node-connection");
                svgCanvas.appendChild(pathSec);

                if (!collapsedSections.has(sec.id)) {
                    sec.chapters.forEach(ch => {
                        const pathCh = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        const dCh = `M ${secX} ${secY} Q ${(secX + ch.x) / 2} ${(secY + ch.y) / 2} ${ch.x} ${ch.y}`;
                        pathCh.setAttribute("d", dCh);
                        pathCh.setAttribute("fill", "none");
                        pathCh.setAttribute("stroke", `${sec.color}45`);
                        pathCh.setAttribute("stroke-width", "1.5");
                        pathCh.setAttribute("class", "node-connection");
                        svgCanvas.appendChild(pathCh);
                    });
                }
            });
        }

        function selectChapter(ch, sec) {
            activeNodeId = ch.id;
            currentFlatIndex = flatChapters.findIndex(item => item.ch.id === ch.id);

            document.querySelectorAll('.node-active').forEach(n => n.classList.remove('node-active'));
            const activeNode = document.getElementById(`node-${ch.id}`);
            if (activeNode) activeNode.classList.add('node-active');

            document.querySelectorAll('[id^="side-ch-"]').forEach(el => el.classList.remove('bg-indigo-950/40', 'text-white'));
            const activeSide = document.getElementById('side-ch-' + ch.id);
            if (activeSide) activeSide.classList.add('bg-indigo-950/40', 'text-white');

            showModal(ch, sec);
        }

        function showModal(ch, sec) {
            const badge = document.getElementById('detail-type-badge');
            badge.innerText = `Section: ${sec.title}`;
            badge.style.borderColor = `${sec.color}40`;
            badge.style.color = sec.color;
            badge.style.backgroundColor = `${sec.color}15`;

            document.getElementById('detail-chapter-num').innerText = `CH ${ch.num}`;
            document.getElementById('detail-title').innerText = ch.title;
            document.getElementById('detail-quote').innerText = ch.quote;
            
            const author = document.getElementById('detail-author');
            author.innerText = `— ${ch.author}`;
            author.style.color = sec.color;

            document.getElementById('detail-desc').innerText = ch.desc;
            document.getElementById('strategy-header').style.color = sec.color;

            // Dynamically apply contextual section styling to modal card container
            const card = detailPanel.querySelector('.modal-card');
            card.style.borderColor = `${sec.color}50`;
            card.style.boxShadow = `0 25px 50px -12px ${sec.color}35, inset 0 1px 0 0 rgba(255, 255, 255, 0.05)`;

            updateModalNavButtons(sec);

            detailPanel.classList.remove('opacity-0', 'pointer-events-none');
            detailPanel.classList.add('opacity-100', 'pointer-events-auto');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        // Refined structural boundary crossing logic for button values
        function updateModalNavButtons(currentSec) {
            const prevBtn = document.getElementById('modal-prev');
            const nextBtn = document.getElementById('modal-next');
            
            if (currentFlatIndex > 0) {
                const prevItem = flatChapters[currentFlatIndex - 1];
                prevBtn.disabled = false;
                if (prevItem.sec.id !== currentSec.id) {
                    prevBtn.innerHTML = `<i class="fa-solid fa-angles-left"></i> Previous Section`;
                    prevBtn.style.backgroundColor = prevItem.sec.color;
                } else {
                    prevBtn.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Previous Chapter`;
                    prevBtn.style.backgroundColor = currentSec.color;
                }
            } else {
                prevBtn.disabled = true;
                prevBtn.innerHTML = `<i class="fa-solid fa-arrow-left"></i> Previous Chapter`;
                prevBtn.style.backgroundColor = "";
            }

            if (currentFlatIndex < flatChapters.length - 1 && currentFlatIndex !== -1) {
                const nextItem = flatChapters[currentFlatIndex + 1];
                nextBtn.disabled = false;
                if (nextItem.sec.id !== currentSec.id) {
                    nextBtn.innerHTML = `Next Section <i class="fa-solid fa-angles-right"></i>`;
                    nextBtn.style.backgroundColor = nextItem.sec.color;
                } else {
                    nextBtn.innerHTML = `Next Chapter <i class="fa-solid fa-arrow-right"></i>`;
                    nextBtn.style.backgroundColor = currentSec.color;
                }
            } else {
                nextBtn.disabled = true;
                nextBtn.innerHTML = `Next Chapter <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.style.backgroundColor = "";
            }
        }

        function hideModal() {
            detailPanel.classList.add('opacity-0', 'pointer-events-none');
            detailPanel.classList.remove('opacity-100', 'pointer-events-auto');
            const card = detailPanel.querySelector('.modal-card');
            card.classList.add('scale-95');
            card.classList.remove('scale-100');
            
            activeNodeId = null;
            document.querySelectorAll('.node-active').forEach(n => n.classList.remove('node-active'));
        }

        function focusOnSection(sec) {
            if (collapsedSections.has(sec.id)) {
                collapsedSections.delete(sec.id);
            } else {
                collapsedSections.add(sec.id);
            }
            renderSidebarNavigation();
            renderMindmapNodes();
            drawConnections();
            zoomTo(1.2, sec.x, sec.y);
        }

        // Navigate and focus on a chapter sequence target
        function focusOnChapterNode(chId) {
            let foundCh = null;
            let foundSec = null;
            mindmapData.sections.forEach(sec => {
                const ch = sec.chapters.find(c => c.id === chId);
                if (ch) {
                    foundCh = ch;
                    foundSec = sec;
                }
            });

            if (foundCh && foundSec) {
                if (collapsedSections.has(foundSec.id)) {
                    collapsedSections.delete(foundSec.id);
                    renderSidebarNavigation();
                    renderMindmapNodes();
                    drawConnections();
                }

                selectChapter(foundCh, foundSec);
                zoomTo(1.35, foundCh.x, foundCh.y);
            }
        }

        function setupEventListeners() {
            workspace.addEventListener('mousedown', (e) => {
                if (isDraggingCard) return;
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            workspace.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.08;
                const factor = e.deltaY < 0 ? zoomFactor : 1 / zoomFactor;
                
                const rect = workspace.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                const canvasMouseX = (mouseX - panX) / scale;
                const canvasMouseY = (mouseY - panY) / scale;
                
                let newScale = scale * factor;
                newScale = Math.max(0.15, Math.min(2.5, newScale));
                
                panX = mouseX - (canvasMouseX * newScale);
                panY = mouseY - (canvasMouseY * newScale);
                scale = newScale;
                
                applyTransform();
            }, { passive: false });

            window.addEventListener('mousemove', (e) => {
                if (isDraggingCard) {
                    const clientX = e.clientX;
                    const clientY = e.clientY;
                    const deltaX = (clientX - startClientX) / scale;
                    const deltaY = (clientY - startClientY) / scale;
                    
                    if (Math.abs(clientX - startClientX) > 4 || Math.abs(clientY - startClientY) > 4) {
                        hasMovedDrag = true;
                    }
                    
                    const targetObj = findNodeData(draggedNodeId);
                    if (targetObj) {
                        targetObj.x = cardStartX + deltaX;
                        targetObj.y = cardStartY + deltaY;
                        
                        const nodeEl = document.getElementById(`node-${draggedNodeId}`);
                        if (nodeEl) {
                            nodeEl.style.left = `${targetObj.x}px`;
                            nodeEl.style.top = `${targetObj.y}px`;
                        }
                        drawConnections();
                    }
                } else if (isDragging) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    applyTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDraggingCard) {
                    isDraggingCard = false;
                    draggedNodeId = null;
                }
                isDragging = false;
            });

            workspace.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    isDragging = false;
                    isDraggingCard = false;
                    initialDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialScale = scale;
                    initialPanX = panX;
                    initialPanY = panY;
                } else if (e.touches.length === 1 && !isDraggingCard) {
                    isDragging = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                }
            }, { passive: true });

            workspace.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = dist / initialDistance;
                    
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const rect = workspace.getBoundingClientRect();
                    const relativeMidX = midX - rect.left;
                    const relativeMidY = midY - rect.top;

                    const canvasMidX = (relativeMidX - initialPanX) / initialScale;
                    const canvasMidY = (relativeMidY - initialPanY) / initialScale;

                    let newScale = initialScale * factor;
                    newScale = Math.max(0.15, Math.min(2.5, newScale));

                    panX = relativeMidX - (canvasMidX * newScale);
                    panY = relativeMidY - (canvasMidY * newScale);
                    scale = newScale;

                    applyTransform();
                } else if (isDraggingCard && e.touches.length === 1) {
                    const clientX = e.touches[0].clientX;
                    const clientY = e.touches[0].clientY;
                    const deltaX = (clientX - startClientX) / scale;
                    const deltaY = (clientY - startClientY) / scale;
                    
                    if (Math.abs(clientX - startClientX) > 4 || Math.abs(clientY - startClientY) > 4) {
                        hasMovedDrag = true;
                    }
                    
                    const targetObj = findNodeData(draggedNodeId);
                    if (targetObj) {
                        targetObj.x = cardStartX + deltaX;
                        targetObj.y = cardStartY + deltaY;
                        
                        const nodeEl = document.getElementById(`node-${draggedNodeId}`);
                        if (nodeEl) {
                            nodeEl.style.left = `${targetObj.x}px`;
                            nodeEl.style.top = `${targetObj.y}px`;
                        }
                        drawConnections();
                    }
                } else if (isDragging && e.touches.length === 1) {
                    panX = e.touches[0].clientX - startX;
                    panY = e.touches[0].clientY - startY;
                    applyTransform();
                }
            }, { passive: false });

            window.addEventListener('touchend', () => {
                if (isDraggingCard) {
                    isDraggingCard = false;
                    draggedNodeId = null;
                }
                isDragging = false;
            });

            // Interactive Click-to-Copy Engine compatible with Iframe Security restrictions (using fallback textarea and execCommand)
            document.getElementById('quote-container').addEventListener('click', () => {
                const quoteText = document.getElementById('detail-quote').innerText;
                const authorText = document.getElementById('detail-author').innerText;
                const textToCopy = `"${quoteText}" ${authorText}`;

                // Create a temporary off-screen textarea to select and execute the legacy copy action
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = textToCopy;
                tempTextArea.style.position = "fixed";
                tempTextArea.style.top = "0";
                tempTextArea.style.left = "0";
                tempTextArea.style.opacity = "0";
                document.body.appendChild(tempTextArea);
                
                tempTextArea.focus();
                tempTextArea.select();

                let copied = false;
                try {
                    copied = document.execCommand('copy');
                } catch (err) {
                    console.error('Fallback copy command execution failed: ', err);
                }
                document.body.removeChild(tempTextArea);

                if (copied) {
                    const tooltip = document.getElementById('quote-tooltip');
                    tooltip.innerText = "Copied!";
                    tooltip.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
                    tooltip.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');

                    setTimeout(() => {
                        tooltip.innerText = "Click to copy quote";
                        tooltip.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
                        tooltip.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
                    }, 1400);
                }
            });

            document.getElementById('modal-prev').addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentFlatIndex > 0) {
                    const prevItem = flatChapters[currentFlatIndex - 1];
                    focusOnChapterNode(prevItem.ch.id);
                }
            });

            document.getElementById('modal-next').addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentFlatIndex < flatChapters.length - 1 && currentFlatIndex !== -1) {
                    const nextItem = flatChapters[currentFlatIndex + 1];
                    focusOnChapterNode(nextItem.ch.id);
                }
            });

            document.getElementById('zoom-reset').addEventListener('click', () => {
                centerWorkspace();
            });

            document.getElementById('toggle-sidebar').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                const toggleIcon = document.querySelector('#toggle-sidebar i');
                
                sidebar.classList.toggle('hidden');
                toggleIcon.className = sidebar.classList.contains('hidden') ? 'fa-solid fa-bars' : 'fa-solid fa-xmark';

                setTimeout(() => {
                    centerWorkspace();
                    drawConnections();
                }, 150);
            });

            document.getElementById('btn-expand-all').addEventListener('click', () => {
                collapsedSections.clear();
                renderSidebarNavigation();
                renderMindmapNodes();
                drawConnections();
            });

            document.getElementById('btn-collapse-all').addEventListener('click', () => {
                mindmapData.sections.forEach(sec => collapsedSections.add(sec.id));
                renderSidebarNavigation();
                renderMindmapNodes();
                drawConnections();
            });

            document.getElementById('close-detail').addEventListener('click', () => {
                hideModal();
            });

            // Dismiss modal when backdrop is clicked
            detailPanel.addEventListener('click', (e) => {
                if (e.target === detailPanel) {
                    hideModal();
                }
            });

            // Integrated instant search system with node matching states
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                if (!term) {
                    document.querySelectorAll('.dynamic-node').forEach(node => node.style.opacity = '1');
                    return;
                }

                mindmapData.sections.forEach(sec => {
                    const matchedChapters = sec.chapters.filter(ch => 
                        ch.title.toLowerCase().includes(term) || 
                        ch.author.toLowerCase().includes(term) || 
                        ch.quote.toLowerCase().includes(term) || 
                        ch.desc.toLowerCase().includes(term)
                    );

                    if (matchedChapters.length > 0 && collapsedSections.has(sec.id)) {
                        collapsedSections.delete(sec.id);
                    }
                });

                renderSidebarNavigation();
                renderMindmapNodes();
                drawConnections();

                mindmapData.sections.forEach(sec => {
                    const matchesSecName = sec.title.toLowerCase().includes(term);
                    const secNode = document.getElementById(`node-${sec.id}`);
                    if (secNode) {
                        secNode.style.opacity = matchesSecName ? '1' : '0.25';
                    }

                    sec.chapters.forEach(ch => {
                        const chNode = document.getElementById(`node-${ch.id}`);
                        if (chNode) {
                            const isMatch = ch.title.toLowerCase().includes(term) || 
                                            ch.author.toLowerCase().includes(term) || 
                                            ch.quote.toLowerCase().includes(term) || 
                                            ch.desc.toLowerCase().includes(term);
                            chNode.style.opacity = isMatch ? '1' : '0.15';
                        }
                    });
                });
            });
        }

        function applyTransform() {
            nodesContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            svgCanvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function centerWorkspace() {
            scale = 0.55;
            const viewportWidth = workspace.clientWidth;
            const viewportHeight = workspace.clientHeight;
            
            panX = (viewportWidth / 2) - (2000 * scale);
            panY = (viewportHeight / 2) - (2000 * scale);
            
            applyTransform();
        }

        function zoomTo(targetScale, absoluteX, absoluteY) {
            const viewportWidth = workspace.clientWidth;
            const viewportHeight = workspace.clientHeight;

            scale = targetScale;
            panX = (viewportWidth / 2) - (absoluteX * scale);
            panY = (viewportHeight / 2) - (absoluteY * scale);

            applyTransform();
        }
    </script>
</body>
</html>
